<!DOCTYPE html>
<html>
<head>
  <title>Message Sent! - Whimsical Cards</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    :root {
      --red: #e53935; --blue: #3b4cca; --yellow: #ffde00; --green: #4CAF50;
      --bg-color: #f0f4f8; --card-bg: #ffffff; --text-color: #333333; --light-gray: #e9ecef;
      --purple: #9c27b0; --orange: #ff6f00;
    }
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif; max-width: 900px; margin: 0 auto; padding: 20px;
      line-height: 1.6; background-color: var(--bg-color); color: var(--text-color);
      background-image: url('https://www.transparenttextures.com/patterns/pokemon.png');
      min-height: 100vh;
    }
    .logo-container { text-align: center; margin: 20px 0; }
    .business-logo { max-width: 220px; height: auto; filter: drop-shadow(0 2px 5px rgba(0,0,0,0.2)); }
    nav {
      text-align: center; margin: 25px 0; padding: 15px; background: var(--blue);
      border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    nav a {
      margin: 0 15px; color: white !important; text-decoration: none; font-weight: bold;
      font-size: 1.1rem; transition: all 0.3s;
    }
    nav a:hover { color: var(--yellow) !important; transform: translateY(-2px); }

    .thanks-card {
      background: var(--card-bg); border-radius: 20px; padding: 50px 30px; margin: 40px auto;
      max-width: 560px; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,0.15);
      border: 3px solid var(--green);
    }
    .thanks-icon {
      font-size: 4.5rem; margin-bottom: 10px; animation: pop 0.5s ease;
    }
    @keyframes pop {
      0% { transform: scale(0); } 70% { transform: scale(1.15); } 100% { transform: scale(1); }
    }
    .thanks-card h1 {
      color: var(--green); font-size: 2.2rem; font-weight: 900; margin: 10px 0;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
    }
    .thanks-card p {
      font-size: 1.1rem; margin: 14px 0;
    }
    .thanks-card .response-time {
      display: inline-block; background: var(--yellow); color: #333; font-weight: bold;
      padding: 10px 20px; border-radius: 30px; margin: 16px 0; box-shadow: 0 2px 5px rgba(0,0,0,0.15);
    }
    .back-btn {
      display: inline-block; margin-top: 20px; background: var(--blue); color: white !important;
      text-decoration: none; font-weight: bold; font-size: 1.1rem; padding: 14px 34px;
      border-radius: 40px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); transition: all 0.3s;
    }
    .back-btn:hover { transform: translateY(-3px); background: var(--purple); }
  </style>
</head>
<body>
  <div class="logo-container">
    <img src="logo.png" alt="Whimsical Cards Logo" class="business-logo">
  </div>

  <nav>
    <a href="index.html">Trade Calculator</a> |
    <a href="contact.html">Contact</a> |
    <a href="terms.html">T&Cs</a>
    <a href="privacy.html">Privacy Policy</a>
  </nav>

  <div class="thanks-card">
    <div class="thanks-icon">✅</div>
    <h1>Message Sent!</h1>
    <p>Thanks — your message has landed safely in our inbox.</p>
    <div class="response-time">⚡ We reply within 24 hours!</div>
    <div id="refBox"></div>
    <p>In the meantime, feel free to have another play with the calculator.</p>
    <a href="index.html" class="back-btn">Back to Trade Calculator</a>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const ref = params.get("ref");
    if (ref) {
      document.getElementById("refBox").innerHTML = `
        <div style="background:#f0f4f8;border:2px dashed var(--blue);border-radius:12px;padding:14px 18px;margin:18px 0;">
          <div style="font-size:0.9rem;color:#666;">📌 Your trade reference number</div>
          <div style="font-size:1.4rem;font-weight:900;color:var(--blue);letter-spacing:1px;">${ref}</div>
          <div style="font-size:0.85rem;color:#666;margin-top:4px;">We've also emailed you a copy — but save this just in case!</div>
        </div>
      `;
    }
  </script>
</body>
</html>
